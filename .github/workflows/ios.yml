name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26 (falls back to 16)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          echo "Selecting $X"
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install toolchain dependencies
        run: |
          brew install xcodegen meson ninja llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Prepare iOS runtime resources
        run: bash ./scripts/prepare-ios-runtime.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: iosApp

      - name: Show schemes
        run: xcodebuild -project Zaether.xcodeproj -list
        working-directory: iosApp

      - name: Build app (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild \
            -project Zaether.xcodeproj \
            -scheme Aether \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | tail -40
        working-directory: iosApp

      - name: Package unsigned IPA
        run: |
          APP=$(find iosApp/build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "App bundle: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Zaether-unsigned.ipa Payload
          ls -lh Zaether-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaether-unsigned-ipa
          path: Zaether-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: iosApp/xcodebuild.log
